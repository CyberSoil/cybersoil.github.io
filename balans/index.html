<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f8f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Баланс">
  <meta name="description" content="Бесплатный дневник питания, веса и активности с персональными расчётами и понятными рекомендациями.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Баланс — мой путь</title>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="brand"><span class="brand-symbol" aria-hidden="true">✳</span><span>баланс<span class="brand-dot">.</span></span></div>
      <div class="header-right"><span class="offline-pill" id="connection-pill">Личный дневник</span><button type="button" class="header-avatar" data-tab="plan" aria-label="Настройки профиля">⚙</button></div>
    </header>
    <main id="screen" tabindex="-1"><noscript>Для работы приложения необходимо включить JavaScript.</noscript></main>
    <nav class="bottom-nav" aria-label="Разделы приложения">
      <button type="button" data-tab="today" class="nav-item is-active"><span class="nav-icon">⌂</span><span>Сегодня</span></button>
      <button type="button" data-tab="diary" class="nav-item"><span class="nav-icon">▤</span><span>Дневник</span></button>
      <button type="button" data-tab="progress" class="nav-item"><span class="nav-icon">▥</span><span>Прогресс</span></button>
      <button type="button" data-tab="plan" class="nav-item"><span class="nav-icon">◎</span><span>Мой план</span></button>
    </nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
